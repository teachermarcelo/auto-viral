name = "autoviral-meta-api"
main = "src/index.ts"
compatibility_date = "2026-11-23"

# Configure META_CONNECTIONS as a KV namespace in the Cloudflare dashboard.
# Set secrets through Wrangler/Cloudflare dashboard; never commit their values.
[[kv_namespaces]]
binding = "META_CONNECTIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
APP_ORIGIN = "https://teachermarcelo.github.io"
FIREBASE_PROJECT_ID = "autoviral-data-core"
META_GRAPH_VERSION = "v24.0"
