name: Deploy AutoViral AI to GitHub Pages

on:
  push:
    branches:
      - feat/phase-1-foundation
      - feat/platform-migration-chrome-extension
      - feat/autoviral-data-core
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    # The github-pages environment is protected for the stable Pages branch.
    # Feature branches still run the build, but must not attempt a production deploy.
    if: github.ref == 'refs/heads/feat/phase-1-foundation' || github.ref == 'refs/heads/feat/platform-migration-chrome-extension' || github.ref == 'refs/heads/feat/autoviral-data-core'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
