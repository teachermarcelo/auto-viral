name: Package AutoViral Chrome Extension

on:
  push:
    branches:
      - feat/platform-migration-chrome-extension
    paths:
      - "chrome-extension/**"
      - ".github/workflows/package-chrome-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('chrome-extension/manifest.json','utf8'))"
      - name: Validate extension JavaScript
        run: |
          node --check chrome-extension/background.js
          node --check chrome-extension/content.js
          node --check chrome-extension/platform-bridge.js
          node --check chrome-extension/popup.js
      - name: Verify manifest entrypoints
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('chrome-extension/manifest.json','utf8')); for (const s of (m.content_scripts||[])) for (const f of s.js||[]) if (!fs.existsSync('chrome-extension/'+f)) throw new Error('Missing content script: '+f); if (m.background?.service_worker && !fs.existsSync('chrome-extension/'+m.background.service_worker)) throw new Error('Missing service worker: '+m.background.service_worker); if (m.action?.default_popup && !fs.existsSync('chrome-extension/'+m.action.default_popup)) throw new Error('Missing popup: '+m.action.default_popup); console.log('All manifest entrypoints exist.');"
      - name: Package extension
        run: cd chrome-extension && zip -r ../autoviral-chrome-extension.zip .
      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: autoviral-chrome-extension
          path: autoviral-chrome-extension.zip
          if-no-files-found: error
          retention-days: 30
