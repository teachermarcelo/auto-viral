name: AutoViral Meta Worker CI

on:
  push:
    branches: [feat/autoviral-data-core]
    paths:
      - "workers/meta-api/**"
      - ".github/workflows/meta-worker-ci.yml"
  pull_request:
    paths:
      - "workers/meta-api/**"
      - ".github/workflows/meta-worker-ci.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/meta-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/meta-api/package.json
      - run: npm install
      - run: npm run typecheck
