name: AutoViral Data Core CI

on:
  push:
    branches: [feat/autoviral-data-core]
    paths:
      - "data-core/**"
      - ".github/workflows/data-core-ci.yml"
  pull_request:
    paths:
      - "data-core/**"
      - ".github/workflows/data-core-ci.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-core/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: data-core/api/package.json
      - run: npm install
      - run: npm run typecheck
