<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoViral AI</title><style>
:root{color-scheme:dark;font:14px Arial,sans-serif;background:#10111b;color:#f4f5ff}*{box-sizing:border-box}body{width:360px;margin:0;padding:18px;background:linear-gradient(160deg,#17182a,#10111b)}h1{font-size:18px;margin:0 0 4px;color:#fff}p{color:#aeb2ca;font-size:12px;line-height:1.5;margin:6px 0 14px}.tag{color:#9b8cff;font-weight:700;font-size:10px;letter-spacing:1.2px}label{display:block;font-size:12px;color:#c7c9dc;margin:12px 0 5px}input,textarea{width:100%;background:#202235;border:1px solid #393b55;border-radius:8px;padding:10px;color:#fff;font:13px Arial}textarea{min-height:112px;resize:vertical}.btn{width:100%;border:0;border-radius:8px;padding:11px;margin-top:10px;font-weight:700;cursor:pointer;background:#7958ee;color:#fff}.btn.alt{background:#292b40;border:1px solid #42445e}.status{margin-top:10px;color:#a7e6bd;font-size:12px;min-height:16px}.foot{border-top:1px solid #303247;margin-top:14px;padding-top:10px;font-size:11px;color:#9296b1}
</style></head><body>
<div class="tag">ROBOT ENGINE · CHROME</div><h1>AutoViral AI</h1><p>Assistente de execução no navegador. Abra o grupo, confira as regras e faça você mesmo as ações que exigem autorização do Facebook.</p>
<label for="url">URL do grupo do Facebook</label><input id="url" type="url" placeholder="https://www.facebook.com/groups/...">
<label for="copy">Texto da publicação</label><textarea id="copy" placeholder="Cole aqui o texto aprovado da campanha..."></textarea>
<button id="open" class="btn">Salvar tarefa e abrir grupo</button>
<button id="capture" class="btn alt">Capturar página atual como oportunidade</button>
<button id="export" class="btn alt">Exportar capturas para AutoViral</button>
<div id="status" class="status" role="status"></div><div class="foot">Não coleta membros, não envia mensagens e não publica automaticamente. A extensão não solicita sua senha.</div>
<script src="popup.js"></script></body></html>
